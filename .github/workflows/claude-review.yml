name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing a pull request for the Survey platform.

            Read these first, in order:
              1. CLAUDE.md (root) — coding standards (§3), security guardrails (§4),
                 on-chain vs off-chain rule (§2), testing bar (§6), PR conventions (§7).
              2. .claude/design-guidelines.md — only if the diff touches apps/web/**
                 or packages/ui/**.
              3. The PR title, body, and full diff.

            Then post review comments using these rules:

            BLOCKERS (must fix before merge) — file as inline review comments
            with severity prefix `[BLOCKER]`:
              - Backend code holding user keys
              - Validator keypair committed
              - Missing commit-hash for response payloads
              - Raw CPI transfer from PDA without invariant check
              - `panic!` in Anchor instruction handlers
              - Unchecked math in Rust (use checked_add/sub/mul)
              - Direct hex color literals or arbitrary Tailwind values in UI

            FINDINGS (should fix) — inline comments prefixed `[FINDING]`:
              - TypeScript `any`, default-exported components, deep cross-package
                relative imports
              - Missing zod validation on API inputs
              - Missing rate-limit / uniqueness on (wallet, survey)
              - New Anchor instructions without both happy-path AND failure tests
              - Frontend anti-patterns from design-guidelines.md §6

            NITS — inline comments prefixed `[NIT]`:
              - Style polish, naming, comment clarity

            Also post a single SUMMARY review comment with:
              - Counts: <X> blockers, <Y> findings, <Z> nits
              - On-chain account size delta (if packages/anchor/ changed)
              - Whether commits follow `<type>(<scope>): <subject> (#N)` and
                reference an issue
              - Suggested PR split if diff is large (> ~400 substantive lines)

            Do not approve or request changes — leave the merge decision to humans.
            Be specific: every comment must reference file + line.
